<script type="text/javascript">
var key = new RSAUtils.getKeyPair('10001', "", '942328055d45918cfd772f900039888719958b8ce02e37d2d48e115c64f6cb247e1bb5c1daca38b4ed9bfafd7d3f42457c3c8da0e652d4044a8ad0e654082d9b');
</script>

<script type="text/javascript">
//登录
function login(){
	document.subForm.action = "/yjszj/login";
    document.subForm.submit();
}

//enter登录
document.onkeyup = function(event){
	e = event ? event : (window.event ? window.event : null);
	if(e.keyCode == 13){
		onSubmitLogin();
	}
}
function onChkLogin(){
    if ($("#usercode").val() == "" ){
        alert ("请输入用户名!");
        $("#usercode").focus();
        return false;
    }
    if ($("#password").val() == "" ){
        alert ("请输入密码!");
        $("#password").focus();
        return false;
    }
    if ($("#code").val() == "" ){
        alert ("请输入验证码!");
        $("#code").focus();
        return false;
    }
    return true;
}
function onSubmitLogin(){
    if(!onChkLogin()){
        return false;
    }else{
    	$.ajax({
			type:"POST",
			url:'/yjszj/checkCode?code='+$("#code").val(),
			cache:false,
			dataType:"json",
			success:function (result){
 				if(!result){
					alert('验证码错误!');
					$("#code").focus();
					changeValidateCode();
					return false;
				}
 				var rsaUsercode = RSAUtils.encryptedString(key,$("#usercode").val());
 				var rsaPassword = RSAUtils.encryptedString(key,$("#password").val());
 				var rsaCode = RSAUtils.encryptedString(key,$("#code").val());
				$.ajax({
					type:"POST",
					url:'/yjszj/checkLogin',
					cache:false,
					data:{'usercode':rsaUsercode,'password':rsaPassword},
					dataType:"json",
					success:function (result){
		 				if(result == 1){
							alert('用户名或密码错误!');
							changeValidateCode();
							return false;
						}else if(result == 2){
							alert('您目前不是在校学生，请联系教务处');
							changeValidateCode();
							return false;
						}else if(result == 0){
							$("#sub_usercode").val(rsaUsercode);
							$("#sub_password").val(rsaPassword);
							$("#sub_code").val(rsaCode);
							login();
						}else if(result == 3){
							alert('密码错误次数已达上限，请联系学院管理员重置密码!');
							changeValidateCode();
							return false;
						}else{
							alert("系统错误!");
							changeValidateCode();
						}
					}
				});
			}
		});
	}
}

function changeValidateCode(obj) {
  		//每次请求需要一个不同的参数，否则可能会返回同样的验证码
	//这和浏览器的缓存机制有关系，也可以把页面设置为不缓存，这样就不用这个参数了。
	obj.src="/yjszj/captchaImage?id="+Math.round(Math.random()*10000);
}

function changeValidateCode() {
	//每次请求需要一个不同的参数，否则可能会返回同样的验证码
//这和浏览器的缓存机制有关系，也可以把页面设置为不缓存，这样就不用这个参数了。
document.getElementById("yzmmsg").src="/yjszj/captchaImage?id="+Math.round(Math.random()*10000);
}
function queryCkXylhdh(){
	$("#ckjsxmiframe").attr("src","/yjszj/xxtc/queryCkXylhdh");

//导出excel
function toExcel(){
	var id = '3';
	$.ajax({  
        type:'post',      
        url:'/yjszj/consumerExp/checkExcel?&id='+id,    
        success:function(data){
        	if(data==0){
        		alert("导出模板信息维护不全，请联系管理员！");
        	}
        	if(data==2){
        		alert("表或视图不存在，请联系管理员！");
        	}
        	if(data==1){
        		window.location.href='http://jxyw.scu.edu.cn:8081/yjszj/consumerExp/excel?id='+id;
        	}
        },
        error:function(data){
         alert("跳转失败");
        }  
    });  
}
</script>
