     function loadURI(){

     	if (null == secospace_current_login_user_info) {
     	Ext.Ajax.request({
	     		   sync : false,
			   url: '../../business/tsmLogin!getCurrentUserInfo.action',
			   method: 'POST',
			   success: function(response, options) {
			   		if (response.responseText != null && response.responseText != '') {
			   			secospace_current_login_user_info = Ext.decode(response.responseText).data;
			   		}
			   }
		});
		}
		

		var connLimit = Ext.lib.Ajax.getConnectionObject().conn;
		connLimit.open('post','../../business/tsmLogin!getPageLimit.action?date='+(new Date()).getTime(),false);
		connLimit.send(null);
		if(connLimit.status == '200'){
		
			if (connLimit.responseText != null && connLimit.responseText != ''){
				var result = Ext.util.JSON.decode(connLimit.responseText);
	   			
		   		if (result != null && result.data != null) {
		   			secospace_grid_page_limit = result.data;
		   			
		   		}else{
		   			secospace_grid_page_limit = 10;
		   		}
	   		}else{
	   			secospace_grid_page_limit = 10;
	   		}
		}

		var connLicense = Ext.lib.Ajax.getConnectionObject().conn;
		connLicense.open('post','../../business/secoVendorAction!vendor.action',false);
		connLicense.send(null);
		if(connLicense.status == '200'){
		
			if (connLicense.responseText != null && connLicense.responseText != ''){
				var result = Ext.util.JSON.decode(connLicense.responseText);
		   		if (result != null && result.data != null) {
		   			licenseNote = result.data.licenseNote;
		   			licensePeak = result.data.licensePeak;
		   			licenseApply1 = result.data.licenseApply1;
		   			licenseApply2 = result.data.licenseApply2;
		   			copyright = result.data.copyright;
		   			company = result.data.company;
		   			vendor = result.data.vendor;
		   			pagetitle = result.data.title;
		   			licenseRevokeInfo =  result.data.licenseRevokeInfo;
		   			licenseRetrievedInfo = result.data.licenseRetrievedInfo;
		   		}
	   		}
		}
		if(!eSight_Inter){
		
		}
		
        
        Ext.Ajax.request({
               url: '../../secospace/dynpermissionAction!getCurUserAllTemplatePermisson.action',
               method: 'POST',
               success: function(response, options) {
                    if (response.responseText != null && response.responseText != '') {
                    	allTemplatePermissionForCurUser = Ext.decode(response.responseText).data[0];
                        haveAllPolicyTemplate = Ext.decode(response.responseText).data[1].haveAll;
                    }
               }
        });
        
        loadDeskTop();
	 	 

	 if(!eSight_Inter){
		 var userAccount = secospace.login.getUserAccount();
		 if(userAccount != 'RemoteAdmin')
		 {
		 	secospace.login.checkPassword();
		 }else{
		 	secospace.login.isNeedShow();
		 }

		 secospace.login.stateMonitor();

		 secospace.login.licenseRevokeCheckAndlicenseInfoIsLack();
		 lastLoginInfo();
	 }
	 }
