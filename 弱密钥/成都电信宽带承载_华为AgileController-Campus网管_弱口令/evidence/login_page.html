			function FlyBalls(options){
				var self = this;
				var settings = $.extend({
					container : document.body,
					maxNum: 100,
					maxSpeed: 80000,
					minSpeed: 4000,
					maxRadius: 30,
					minRadius: 15,
					minOpacity:0
				},options || {});
				
				self.container = $(settings.container);
				self.colorArr = ["#a574b3","#da6241","#9dd4b7","#d0de40","#37bed4"];
				self.circleClass = ["purple","orange","yellow","green","blue"];
				
				function createBall(bo){
					var temp = parseInt(Math.random() * settings.maxRadius),
						temp2 =  Math.random(),
						br = ( temp <= settings.minRadius) ? settings.minRadius : temp,
						l = self.container.offset().left + Math.random() * (self.container.width() - br),
						t = -Math.random() * self.container.height()/2 -br,
						r = parseInt(Math.random() * 255),
						g = parseInt(Math.random() * 255),
						b = parseInt(Math.random() * 255),
						a = temp2 <= settings.minOpacity? settings.minOpacity : temp2,
						bgColor = self.colorArr[parseInt(self.colorArr.length * Math.random())];
						bgClass = self.circleClass[parseInt(self.circleClass.length * Math.random())];
					if(document.createElementNS){
					
							if(typeof bo == 'undefined')
							{
							  var ballItem = $("<div class='ball' style='width:"+br+"px;height:"+br+"px;top:"+t+"px;left:"+l+"px;background:"+bgColor+";'></div>").appendTo(self.container);
							  aniBall(ballItem);
							}
							else{
							bo.css({
									"top" : t + "px",
									"left" : l + "px",
									"opacity" : 1
								   })
							aniBall(bo);
							}
					} else {
							if(typeof bo == 'undefined')
							{
							var ballItem = $("<div class='ball "+bgClass+"' style='top:"+t+"px;left:"+l+"px;'></div>").appendTo(self.container);
							aniBall(ballItem);
							}
							else{
							bo.css({
									"top" : t + "px",
									"left" : l + "px",
									"opacity" : 1
								   })
						   aniBall(bo);
							}
					}
				}
				
				function removeBall(ballObj){
					ballObj.remove();
				}
				
				function aniBall(ballItem){
					var bi = ballItem,
						temp = parseInt(Math.random() * settings.maxSpeed),
						speed = temp <= settings.minSpeed ? settings.minSpeed : temp;
					var dd =(self.container.width()/2)+ 230;
					bi.animate({"top":(self.container.height()-bi.height())+"px","left":(self.container.width()/2 - bi.width()*1.5 + self.container.offset().left )+ "px","opacity":0},{duration:speed, complete: function(){
								var bo = $(this);
				
								createBall(bo);				
							}});
				}
				
				function init(){
					for(var i=0;i<settings.maxNum;i++){
					var bo;
						createBall(bo);
					}
				}
				init();  
			}
	function getBrowserInfo() {
	var ua = navigator.userAgent, tem,
	M = ua.match(/(opera|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
	if (/trident/i.test(M[1])) {
	tem = /\brv[ :]+(\d+)/g.exec(ua) || [];
	return 'IE ' + (tem[1] || '');
	}
	if (M[1] === 'Chrome') {
	tem = ua.match(/\b(OPR|Edge)\/(\d+)/);
	if (tem != null) return tem.slice(1).join(' ').replace('OPR', 'Opera');
	}
	M = M[2] ? [M[1], M[2]] : [navigator.appName, navigator.appVersion, '-?'];
	if ((tem = ua.match(/version\/(\d+)/i)) != null) {
	M.splice(1, 1, tem[1]);
	}
	return M.join(' ');
	}
	function isBrowserRecommended() {
	var browser = getBrowserInfo().split(' '),
	browserName = '',
	browserVersion = 0;
	browserName = browser[0];
	browserVersion = browser[1] ? parseInt(browser[1]) : 0;
	if (browserName.indexOf('IE') >= 0 && browserVersion >= 9 && browserVersion <= 11) {
	return true;
	}
	if (browserName === 'Chrome' && browserVersion >= 37 && browserVersion <= 39) {
	return true;
	}
	return false;
	}
